<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab 1.4 - Register Form</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{

    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;

}

.container{

    width:420px;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,.2);

}

h1{

    text-align:center;
    color:#0d6efd;
    margin-bottom:25px;

}

.input-group{

    margin-bottom:18px;

}

label{

    display:block;
    margin-bottom:8px;
    font-weight:bold;

}

input{

    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;

}

button{

    width:100%;
    padding:12px;
    border:none;
    border-radius:5px;
    background:#0d6efd;
    color:white;
    cursor:pointer;
    font-size:16px;

}

button:hover{

    background:#084298;

}

#message{

    margin-top:20px;
    font-weight:bold;
    text-align:center;

}

</style>

</head>

<body>

<div class="container">

<h1>Register Form</h1>

<form id="registerForm">

<div class="input-group">
<label>ชื่อ</label>
<input type="text" id="name">
</div>

<div class="input-group">
<label>Email</label>
<input type="email" id="email">
</div>

<div class="input-group">
<label>Phone</label>
<input type="text" id="phone">
</div>

<div class="input-group">
<label>Password</label>
<input type="password" id="password">
</div>

<button type="submit">
Register
</button>

</form>

<p id="message"></p>

</div>

<script>

const form = document.getElementById("registerForm");

form.addEventListener("submit",function(e){

    e.preventDefault();

    let name = document.getElementById("name").value.trim();
    let email = document.getElementById("email").value.trim();
    let phone = document.getElementById("phone").value.trim();
    let password = document.getElementById("password").value.trim();

    let message = document.getElementById("message");

    if(name===""){

        alert("กรุณากรอกชื่อ");
        return;

    }

    if(email===""){

        alert("กรุณากรอก Email");
        return;

    }

    if(!email.includes("@")){

        alert("Email ไม่ถูกต้อง");
        return;

    }

    if(phone.length!=10 || isNaN(phone)){

        alert("เบอร์โทรต้องมี 10 หลัก");
        return;

    }

    if(password.length<6){

        alert("รหัสผ่านต้องมีอย่างน้อย 6 ตัว");
        return;

    }

    message.style.color="green";
    message.innerHTML="สมัครสมาชิกสำเร็จ";

});

</script>

</body>
</html>
