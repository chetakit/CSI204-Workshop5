<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Lab 3.2 Car Loan</title>

<style>

body{
    font-family:Arial;
    width:700px;
    margin:30px auto;
}

input{
    width:100%;
    padding:10px;
    margin:8px 0;
}

button{
    padding:10px 20px;
}

#result{
    margin-top:20px;
    background:#f5f5f5;
    padding:20px;
}

</style>

</head>

<body>

<h2>คำนวณค่างวดรถยนต์</h2>

<label>ราคารถ (บาท)</label>
<input type="number" id="price">

<label>เงินดาวน์ (%)</label>
<input type="number" id="down" value="20">

<label>ดอกเบี้ย (%)</label>
<input type="number" id="interest" value="2.5">

<label>จำนวนปี</label>
<input type="number" id="year" value="5">

<button onclick="calculateCar()">
คำนวณ
</button>

<div id="result"></div>

<script>

function calculateCar(){

let price=parseFloat(document.getElementById("price").value);

let downPercent=parseFloat(document.getElementById("down").value);

let interest=parseFloat(document.getElementById("interest").value);

let year=parseInt(document.getElementById("year").value);

let downPayment=price*downPercent/100;

let loan=price-downPayment;

let month=year*12;

let rate=interest/100/12;

let payment=

loan*rate*Math.pow(1+rate,month)

/(Math.pow(1+rate,month)-1);

document.getElementById("result").innerHTML=`

<h3>ผลการคำนวณ</h3>

<p>ราคารถ : ${price.toLocaleString()} บาท</p>

<p>เงินดาวน์ : ${downPayment.toLocaleString()} บาท</p>

<p>ยอดจัดไฟแนนซ์ : ${loan.toLocaleString()} บาท</p>

<p>ดอกเบี้ย : ${interest}%</p>

<p>ระยะเวลา : ${year} ปี</p>

<h2>ค่างวดต่อเดือน ${payment.toFixed(2)} บาท</h2>

`;

}

</script>

</body>

</html>
