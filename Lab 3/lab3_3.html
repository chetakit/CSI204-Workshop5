<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Lab 3.3 Electricity Bill</title>

<style>
body{
    font-family:Arial;
    width:700px;
    margin:30px auto;
}

input{
    width:100%;
    padding:10px;
    margin:8px 0;
}

button{
    padding:10px 20px;
}

#result{
    margin-top:20px;
    background:#f5f5f5;
    padding:20px;
}
</style>

</head>

<body>

<h2>คำนวณค่าไฟฟ้า</h2>

<label>จำนวนหน่วยไฟฟ้า (Unit)</label>
<input type="number" id="unit">

<button onclick="calculateElectric()">
คำนวณ
</button>

<div id="result"></div>

<script>

function calculateElectric(){

    let unit = parseFloat(document.getElementById("unit").value);

    if(isNaN(unit) || unit < 0){
        alert("กรุณากรอกจำนวนหน่วยไฟฟ้า");
        return;
    }

    let rate = 4.72; // บาทต่อหน่วย
    let service = 38.22; // ค่าบริการ
    let vat = 0.07;

    let energy = unit * rate;
    let subtotal = energy + service;
    let vatAmount = subtotal * vat;
    let total = subtotal + vatAmount;

    document.getElementById("result").innerHTML = `
        <h3>ผลการคำนวณ</h3>

        <p>จำนวนหน่วย : ${unit} หน่วย</p>

        <p>ค่าไฟ : ${energy.toFixed(2)} บาท</p>

        <p>ค่าบริการ : ${service.toFixed(2)} บาท</p>

        <p>VAT 7% : ${vatAmount.toFixed(2)} บาท</p>

        <h2>รวมทั้งสิ้น ${total.toFixed(2)} บาท</h2>
    `;

}

</script>

</body>
</html>
