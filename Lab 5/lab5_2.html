<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab 5.2 - Shipping</title>

<style>

body{
    font-family:Arial;
    background:#f2f2f2;
    padding:30px;
}

.container{

    width:400px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px gray;

}

input,select{

width:100%;
padding:10px;
margin-top:10px;

}

button{

margin-top:20px;
width:100%;
padding:10px;
background:green;
color:white;
border:none;
cursor:pointer;

}

button:hover{

background:darkgreen;

}

#result{

margin-top:20px;
font-size:18px;

}

</style>

</head>
<body>

<div class="container">

<h2>ระบบคำนวณค่าจัดส่ง</h2>

<label>ราคาสินค้า</label>

<input
type="number"
id="price"
placeholder="กรอกราคาสินค้า">

<label>รูปแบบการจัดส่ง</label>

<select id="shipping">

<option value="15">ธรรมดา (15)</option>

<option value="30">ลงทะเบียน (30)</option>

<option value="50">EMS (50)</option>

</select>

<button onclick="calculate()">คำนวณ</button>

<div id="result"></div>

</div>

<script>

function calculate(){

let price=parseFloat(document.getElementById("price").value);

let shipping=parseFloat(document.getElementById("shipping").value);

if(isNaN(price) || price<=0){

alert("กรอกราคาสินค้า");

return;

}

if(price>=500){

shipping=0;

}

let total=price+shipping;

document.getElementById("result").innerHTML=`

ราคาสินค้า : ${price.toFixed(2)} บาท <br>

ค่าจัดส่ง : ${shipping.toFixed(2)} บาท <br>

<strong>รวมทั้งหมด : ${total.toFixed(2)} บาท</strong>

`;

}

</script>

</body>
</html>
