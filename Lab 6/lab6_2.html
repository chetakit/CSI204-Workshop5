<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab 6.2 - Product Filter</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    padding:30px;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
}

select,button{
    width:100%;
    padding:10px;
    margin-top:15px;
}

button{
    background:#28a745;
    color:white;
    border:none;
    cursor:pointer;
}

button:hover{
    background:#218838;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

table,th,td{
    border:1px solid #ddd;
}

th{
    background:#007bff;
    color:white;
}

th,td{
    padding:10px;
    text-align:center;
}

</style>

</head>
<body>

<div class="container">

<h2>ระบบกรองสินค้า</h2>

<label>เลือกหมวดหมู่</label>

<select id="category">

<option value="ทั้งหมด">ทั้งหมด</option>
<option value="เสื้อผ้า">เสื้อผ้า</option>
<option value="อุปกรณ์">อุปกรณ์</option>
<option value="อาหาร">อาหาร</option>

</select>

<button onclick="filterProduct()">ค้นหา</button>

<div id="result"></div>

</div>

<script>

const products=[

{
name:"เสื้อยืด",
category:"เสื้อผ้า",
price:250,
stock:20
},

{
name:"กางเกงยีนส์",
category:"เสื้อผ้า",
price:590,
stock:15
},

{
name:"เมาส์",
category:"อุปกรณ์",
price:450,
stock:12
},

{
name:"คีย์บอร์ด",
category:"อุปกรณ์",
price:890,
stock:8
},

{
name:"ข้าวสาร",
category:"อาหาร",
price:180,
stock:40
},

{
name:"นม",
category:"อาหาร",
price:65,
stock:30
}

];

function filterProduct(){

const category=document.getElementById("category").value;

let result=[];

if(category==="ทั้งหมด"){

result=products;

}
else if(category==="เสื้อผ้า"){

result=products.filter(product=>product.category==="เสื้อผ้า");

}
else if(category==="อุปกรณ์"){

result=products.filter(product=>product.category==="อุปกรณ์");

}
else if(category==="อาหาร"){

result=products.filter(product=>product.category==="อาหาร");

}

let html=`

<table>

<tr>

<th>ชื่อสินค้า</th>

<th>หมวดหมู่</th>

<th>ราคา</th>

<th>สต็อก</th>

</tr>

`;

result.forEach(product=>{

html+=`

<tr>

<td>${product.name}</td>

<td>${product.category}</td>

<td>${product.price} บาท</td>

<td>${product.stock}</td>

</tr>

`;

});

html+="</table>";

document.getElementById("result").innerHTML=html;

}

filterProduct();

</script>

</body>
</html>
